name: Feature request
description: Suggest an improvement or a missing yjs feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could it work? If it exists in yjs or y-protocols, link the JavaScript API.
