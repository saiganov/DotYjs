name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write # coverage comment on PRs

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DOTYJS_REDIS: localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Generate JS yjs fixtures
        working-directory: tests/interop
        run: npm ci && npm run gen
      - name: Build (.NET)
        run: dotnet build --configuration Release
      - name: Test (.NET) with coverage
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults --settings tests/coverlet.runsettings
      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@72f809aeb50e264d112d87766b105f6e1acb1eb6 # 5.4.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: HtmlInline;MarkdownSummaryGithub;Cobertura
          title: DotYjs coverage
      - name: Coverage summary
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coveragereport
      - name: Coverage comment on the PR
        # the token of a PR from a fork is read-only, so commenting would fail there; the summary and artifact still exist
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: coverage
          path: coveragereport/SummaryGithub.md
      - name: Pack (verify packages build)
        run: dotnet pack --configuration Release --no-build -o packages
      - name: Verify .NET-generated updates and protocol messages with JS yjs / y-protocols
        working-directory: tests/interop
        run: npm run check
      - name: Start sample ASP.NET Core server
        run: |
          dotnet run --project samples/YjsServer --configuration Release --no-build --urls http://localhost:5055 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:5055/api/docs/x/json && break; [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5055/api/docs/x/json)" = "404" ] && break; sleep 1; done
      - name: Verify real y-websocket clients against the .NET server
        working-directory: tests/interop
        run: npm run check-ws -- ws://localhost:5055/collab http://localhost:5055
      - name: Verify the .NET y-websocket client against the JS y-websocket server
        working-directory: tests/interop
        run: npm run check-client -- ../../samples/YjsClient/bin/Release/net10.0/YjsClient.dll
      - name: Server log
        if: failure()
        run: cat server.log || true

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep scan
        # rulesets: C#, secrets, GitHub Actions and the JS interop scripts; findings fail the job
        run: |
          semgrep scan --config p/csharp --config p/secrets --config p/github-actions --config p/javascript \
            --metrics=off --error --text --sarif-output=semgrep.sarif
      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-results
          path: semgrep.sarif
