name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write # coverage comment on PRs

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # coverage comment on PRs
      id-token: write # Codecov upload via OIDC, no token stored in the repository
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DOTYJS_REDIS: localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Generate JS yjs fixtures
        working-directory: tests/interop
        run: npm ci && npm run gen
      - name: Build (.NET)
        run: dotnet build --configuration Release
      - name: Test (.NET) with coverage
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults --settings tests/coverlet.runsettings
      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@861674232075b2c6bd1405a04c4bb9b150653e81 # 5.5.12
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: HtmlInline;MarkdownSummaryGithub;Cobertura
          title: DotYjs coverage
      - name: Coverage summary
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coveragereport
      - name: Upload coverage to Codecov (README badge)
        # OIDC tokens are not issued to PRs from forks, so the upload only runs for this repository's own pushes and PRs
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coveragereport/Cobertura.xml
          use_oidc: true
          fail_ci_if_error: false
      - name: Coverage comment on the PR
        # the token of a PR from a fork is read-only, so commenting would fail there; the summary and artifact still exist
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: coveragereport/SummaryGithub.md
      - name: Benchmarks (smoke run, one iteration each; the numbers are not representative)
        run: |
          dotnet run --project benchmarks/DotYjs.Benchmarks --configuration Release --no-build -- --filter '*' --job dry --artifacts BenchmarkDotNet.Artifacts
          { echo '## Benchmarks (dry run)'; cat BenchmarkDotNet.Artifacts/results/*-report-github.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Pack (verify packages build)
        run: dotnet pack --configuration Release --no-build -o packages
      - name: Verify .NET-generated updates and protocol messages with JS yjs / y-protocols
        working-directory: tests/interop
        run: npm run check
      - name: Start sample ASP.NET Core server
        run: |
          dotnet run --project samples/YjsServer --configuration Release --no-build --urls http://localhost:5055 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:5055/api/docs/x/json && break; [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5055/api/docs/x/json)" = "404" ] && break; sleep 1; done
      - name: Verify real y-websocket clients against the .NET server
        working-directory: tests/interop
        run: npm run check-ws -- ws://localhost:5055/collab http://localhost:5055
      - name: Verify the .NET y-websocket client against the JS y-websocket server
        working-directory: tests/interop
        run: npm run check-client -- ../../samples/YjsClient/bin/Release/net10.0/YjsClient.dll
      - name: Server log
        if: failure()
        run: cat server.log || true

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep scan
        # rulesets: C#, secrets, GitHub Actions and the JS interop scripts; findings fail the job
        run: |
          semgrep scan --config p/csharp --config p/secrets --config p/github-actions --config p/javascript \
            --metrics=off --error --text --sarif-output=semgrep.sarif
      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-results
          path: semgrep.sarif
