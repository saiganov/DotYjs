name: Release

# Publishes the DotYjs packages (src/*) to NuGet.org when a GitHub Release is published in the UI.
# The release tag must look like v1.2.3 (or v1.2.3-preview.1) and point to a commit on main.
#
# Authentication uses NuGet.org Trusted Publishing (OIDC): no API key is stored in the repository.
# NuGet/login exchanges the GitHub OIDC token for a temporary API key that is valid for one hour.
# Requirements:
#   - a Trusted Publishing policy on nuget.org for repository saiganov/DotYjs and workflow file release.yml
#   - the repository variable NUGET_USER with the nuget.org profile name (not the email) that owns the policy
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the packages to the GitHub release
      id-token: write # OIDC token for NuGet.org Trusted Publishing
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0 # full history, to check that the tag is on main
          persist-credentials: false

      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3 or v1.2.3-preview.1"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$(git rev-parse "refs/tags/$TAG^{commit}")" origin/main; then
            echo "::error::Release tag '$TAG' does not point to a commit on main"
            exit 1
          fi
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the repository variable NUGET_USER to the nuget.org profile name"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build and test
        run: |
          dotnet build --configuration Release -p:Version="$VERSION"
          dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          for project in DotYjs DotYjs.AspNetCore DotYjs.AspNetCore.Redis DotYjs.EntityFrameworkCore DotYjs.Dapper; do
            dotnet pack "src/$project/$project.csproj" --configuration Release --no-build -p:Version="$VERSION" -o packages
          done

      - name: NuGet.org login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Attach the packages to the GitHub release
        run: gh release upload "$TAG" packages/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
