name: Release

# Publishes the DotYjs packages (src/*) to NuGet.org when a tag like v0.1.0 is pushed.
# Requires the NUGET_API_KEY repository secret.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Pack
        run: |
          dotnet pack src/DotYjs/DotYjs.csproj -c Release -p:Version=$VERSION -o packages
          dotnet pack src/DotYjs.AspNetCore/DotYjs.AspNetCore.csproj -c Release -p:Version=$VERSION -o packages
          dotnet pack src/DotYjs.AspNetCore.Redis/DotYjs.AspNetCore.Redis.csproj -c Release -p:Version=$VERSION -o packages
          dotnet pack src/DotYjs.EntityFrameworkCore/DotYjs.EntityFrameworkCore.csproj -c Release -p:Version=$VERSION -o packages
          dotnet pack src/DotYjs.Dapper/DotYjs.Dapper.csproj -c Release -p:Version=$VERSION -o packages
      - name: Push to NuGet.org
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: packages/*
          generate_release_notes: true
